apply plugin: 'fabric-loom'

// Minecraft 1.21+ requires Java 21
configureJavaVersion(21)

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // Common module
    implementation project(':common')

    // Minecraft 1.21.1
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.139.5+"

    // Optional dependencies for config GUI
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:15.0.130") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation("com.terraformersmc:modmenu:11.0.3")
}

processResources {
    inputs.property "version", project.version
    
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from(project(':common').sourceSets.main.output)
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
