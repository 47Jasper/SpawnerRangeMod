pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Legacy Fabric'
            url = 'https://maven.legacyfabric.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
    // Plugin versions are explicitly specified in each subproject's build.gradle
    // to avoid classloader conflicts between different Loom versions
}

rootProject.name = 'spawner-sphere-mod'

// Loom version group selection - different Loom versions cannot be loaded together
// Set via: ./gradlew build -PloomGroup=<group>
// Groups: 'loom14' (1.14.4-1.19.4), 'loom18' (1.20.1-1.20.6), 'loom19' (1.21.1-1.21.4),
//         'loom110' (1.21.5-1.21.8), 'loom111' (1.21.10), 'legacy', 'forge', 'all' (default, may conflict)
def loomGroup = providers.gradleProperty('loomGroup').getOrElse('all')

// Common module (always included)
include 'common'

// Fabric modules grouped by Loom version compatibility
if (loomGroup == 'all' || loomGroup == 'loom14') {
    // Loom 1.4-SNAPSHOT modules
    include 'fabric-1.14.4'
    include 'fabric-1.15.2'
    include 'fabric-1.16.5'
    include 'fabric-1.17.1'
    include 'fabric-1.18.2'
    include 'fabric-1.19.2'
    include 'fabric-1.19.4'
}

if (loomGroup == 'all' || loomGroup == 'loom18') {
    // Loom 1.8-SNAPSHOT modules
    include 'fabric-1.20.1'
    include 'fabric-1.20.4'
    include 'fabric-1.20.6'
}

if (loomGroup == 'all' || loomGroup == 'loom19') {
    // Loom 1.9-SNAPSHOT modules
    include 'fabric-1.21.1'
    include 'fabric-1.21.3'
    include 'fabric-1.21.4'
}

if (loomGroup == 'all' || loomGroup == 'loom110') {
    // Loom 1.10-SNAPSHOT modules
    include 'fabric-1.21.5'
    include 'fabric-1.21.8'
}

if (loomGroup == 'all' || loomGroup == 'loom111') {
    // Loom 1.11-SNAPSHOT modules (MC 1.21.10+)
    include 'fabric-1.21.10'
}

if (loomGroup == 'all' || loomGroup == 'legacy') {
    // Legacy Fabric (MC 1.8.9-1.13.2)
    include 'legacy-fabric'
}

if (loomGroup == 'all' || loomGroup == 'forge') {
    // Forge modules
    include 'forge-1.12'
    include 'forge-1.16'
    include 'forge-1.19'
    include 'forge-1.20'

    // NeoForge modules
    include 'neoforge-1.20'
}
