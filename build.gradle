// Plugins are applied directly in subproject build.gradle files
// This allows the common module to build/test independently

allprojects {
    apply plugin: 'java'

    group = 'com.example'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.legacyfabric.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://jitpack.io' }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        // Java version is set per-subproject based on MC version requirements
        // Default to Java 8 for older versions, but can be overridden
        if (!project.hasProperty('javaVersion')) {
            options.release = 8
        }
    }

    // Helper method to configure Java version for subprojects
    ext.configureJavaVersion = { int version ->
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(version)
            }
        }
        tasks.withType(JavaCompile) {
            options.release = version
        }
    }
}

subprojects {
    dependencies {
        implementation 'org.joml:joml:1.10.5'
    }
}
