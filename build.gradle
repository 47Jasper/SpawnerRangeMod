buildscript {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.legacyfabric.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.11-SNAPSHOT'
        classpath 'net.legacyfabric:legacy-looming:1.0-SNAPSHOT'
    }
}

allprojects {
    group = 'com.example'
    version = '1.0.0'

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.legacyfabric.net/' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.neoforged.net/releases/' }
        maven { url 'https://jitpack.io' }
    }

    // Helper method to configure Java version for subprojects
    ext.configureJavaVersion = { int version ->
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(version)
            }
        }
        tasks.withType(JavaCompile) {
            options.release = version
            options.encoding = 'UTF-8'
        }
    }
}

subprojects {
    afterEvaluate {
        dependencies {
            implementation 'org.joml:joml:1.10.8'
        }
        if (!plugins.hasPlugin('fabric-loom')) {
            tasks.withType(JavaCompile) {
                options.encoding = 'UTF-8'
            }
        }
    }
}
