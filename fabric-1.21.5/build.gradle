plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

// Minecraft 1.21.5 requires Java 21
configureJavaVersion(21)

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

// Minecraft 1.21.5 requires Java 21
configureJavaVersion(21)

dependencies {
    // Common module
    implementation project(':common')

    // Minecraft 1.21.5
    minecraft 'com.mojang:minecraft:1.21.5'
    mappings "net.fabricmc:yarn:1.21.5+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.5"

    // Optional dependencies for config GUI
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:18.0.145") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation("com.terraformersmc:modmenu:14.0.0")
}

// Minecraft 1.21.5 requires Java 21
configureJavaVersion(21)

processResources {
    inputs.property "version", project.version
    
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Minecraft 1.21.5 requires Java 21
configureJavaVersion(21)

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// Minecraft 1.21.5 requires Java 21
configureJavaVersion(21)
