name: CI

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.14

    - name: Run Common Tests
      run: gradle :common:test --no-daemon --stacktrace

    - name: Run Fabric 1.21.10 Tests
      run: gradle :fabric-1.21.10:test --no-daemon --stacktrace

    - name: Upload Common Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: common-test-results
        path: common/build/test-results/test/

    - name: Upload Common Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: common-test-report
        path: common/build/reports/tests/test/

    - name: Upload Fabric Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fabric-1.21.10-test-results
        path: fabric-1.21.10/build/test-results/test/

    - name: Upload Fabric Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fabric-1.21.10-test-report
        path: fabric-1.21.10/build/reports/tests/test/
